<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta atrás</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center, rgba(255,255,255,.08), transparent 60%),
        radial-gradient(circle at 20% 20%, rgba(0,140,255,.10), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,.05), transparent 40%);
    filter:blur(60px);
}

.countdown{
    position:relative;
    display:flex;
    gap:10px;
    text-align:center;
    z-index:1;
    flex-wrap: wrap;
}

.block{
    min-width:180px;
    width: 100%;
}

.section{
    font-size:clamp(2rem,9vw,7rem);
    font-weight:800;
    line-height:1;
    letter-spacing:-4px;
    text-shadow:
        0 0 15px rgba(255,255,255,.25),
        0 0 40px rgba(255,255,255,.08);
}
.number{
    font-size:clamp(2rem,9vw,7rem);
    font-weight:800;
    line-height:1;
    letter-spacing:-4px;
    text-shadow:
        0 0 15px rgba(255,255,255,.25),
        0 0 40px rgba(255,255,255,.08);
}

.label{
    margin-top:16px;
    font-size:.9rem;
    text-transform:uppercase;
    letter-spacing:4px;
    color:#999;
    font-weight: 700;
}
.msg { font-size: 16px; margin-top: 60px; text-align: center; font-weight: 500; color: #AAA; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="countdown">
    <div class="block">
        <div class="label">Grados</div>
        <div class="number">6 × 7 - 1</div>
    </div>
    <div class="block">
        <div class="label">Minutos</div>
        <div class="number">2 × 2</div>
    </div>
    <div class="block">
        <div class="label">Segundos</div>
        <div class="number">12,54 × 4</div>
    </div>
</div>
</body>
</html>
